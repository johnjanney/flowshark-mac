name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: Signed and notarised DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check that the version matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION." >&2
            exit 1
          fi
          npm run version:check

      - name: Build, sign, notarise, and staple
        uses: tauri-apps/tauri-action@v0
        env:
          # Signing identity and certificate.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarisation. Use APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH
          # instead if the team prefers a App Store Connect key, which does not
          # expire when a password changes.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'FlowShark __VERSION__'
          releaseBody: 'See CHANGELOG.md for what changed in this release.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Confirm the notarisation ticket is stapled
        run: |
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP" ]; then
            echo "No .app bundle was produced." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Only meaningful when notarisation secrets are configured.
          xcrun stapler validate "$APP" || echo "No stapled ticket: notarisation secrets may be missing."
          spctl --assess --type execute --verbose "$APP" || true
