name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: Signed and notarised DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check that the version matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION." >&2
            exit 1
          fi
          npm run version:check

      - name: Build, sign, notarise, and staple
        uses: tauri-apps/tauri-action@v0
        env:
          # Required: tauri-action creates the release through the API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing identity and certificate.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarisation. Use APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH
          # instead if the team prefers a App Store Connect key, which does not
          # expire when a password changes.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'FlowShark __VERSION__'
          releaseBody: 'See CHANGELOG.md for what changed in this release.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Check the bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"

          if [ -z "$APP" ] || [ -z "$DMG" ]; then
            echo "Expected both an .app and a .dmg; got app='$APP' dmg='$DMG'." >&2
            exit 1
          fi
          echo "Built $APP and $DMG."

          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            # Without a Developer ID this is an ad-hoc signed build. It runs
            # after the user allows it once; it is not distributable as-is.
            echo "::warning::No signing identity configured, so this build is unsigned."
            echo "::warning::Recipients will meet a Gatekeeper warning on first launch."
            codesign --display --verbose=2 "$APP" || true
            exit 0
          fi

          # With a Developer ID, every one of these must hold.
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose "$APP"
