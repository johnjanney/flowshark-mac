name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Front end
    # macOS runners are the only place a Tauri bundle can be produced, and the
    # front end is checked here too so one job covers the whole application.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the version is consistent
        run: npm run version:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the front end
        run: npm run build

      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  rust:
    name: Application shell
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

  bundle:
    name: Unsigned bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the app bundle
        # No signing secrets are used here; this job only proves the bundle
        # builds. Signing and notarisation happen in the release workflow.
        run: npm run tauri:build -- --bundles app

      - uses: actions/upload-artifact@v4
        with:
          name: FlowShark-unsigned
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
