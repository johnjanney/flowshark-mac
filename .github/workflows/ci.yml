name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository; nothing here needs to write to it. The release
# workflow asks for `contents: write` separately, where it is actually used.
permissions:
  contents: read

jobs:
  frontend:
    name: Front end
    # macOS runners are the only place a Tauri bundle can be produced, and the
    # front end is checked here too so one job covers the whole application.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the version is consistent
        run: npm run version:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the front end
        run: npm run build

      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  rust:
    name: Application shell
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

  rust-cross-check:
    name: Application shell (checked from Linux)
    # The macOS-only code is compiled here as well, on the cheaper runner, so a
    # mistake in it is caught even when the macOS jobs are skipped or queued.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cross-check

      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Type-check the macOS-only code
        run: npm run check:macos

  bundle:
    name: Unsigned bundle
    # Produces an installable .dmg on every push. It is unsigned, so macOS
    # warns on first launch — see INSTALLATION.md. Signed builds come from the
    # release workflow, which needs the Developer ID secrets.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the app and the disk image
        # No signing secrets are used here, so the result is unsigned.
        # Signing and notarisation happen in the release workflow.
        run: npm run tauri:build

      - name: Report what was built
        run: |
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "$APP" ] || [ -z "$DMG" ]; then
            echo "Expected both an .app and a .dmg; got app='$APP' dmg='$DMG'." >&2
            exit 1
          fi
          echo "::notice::Built $(basename "$DMG") ($(du -h "$DMG" | cut -f1)), unsigned."
          # The document icon must actually be inside the bundle, or the Finder
          # shows a blank page for .flowshark files.
          test -f "$APP/Contents/Resources/document.icns" \
            || { echo "document.icns is missing from the bundle." >&2; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeIdentifier' "$APP/Contents/Info.plist"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: FlowShark-unsigned-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
