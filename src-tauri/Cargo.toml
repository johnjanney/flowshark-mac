[package]
name = "flowshark"
version = "0.1.0"
description = "A flowchart application for macOS"
authors = ["FlowShark"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
default-run = "flowshark"

[lib]
name = "flowshark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A signed and notarised bundle benefits from a smaller, faster binary.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
